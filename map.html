
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map - WebGIS Student Survival Map</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <style>
    body, html { height: 100%; margin:0; padding:0; font-family: Arial, sans-serif; }
    #map { width: 100%; height: 90vh; }
    .navbar { background: #5B7E3C; padding: 12px; color: #fff; text-align:center; font-weight:bold; }
  </style>
</head>
<body>
  <div class="navbar">WebGIS Student Survival Map</div>
  <div id="map"></div>
  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
  <script>
    const map = L.map('map').setView([-6.2, 106.8], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const marker1 = L.marker([-6.2, 106.8]).addTo(map).bindPopup("Lokasi A");
    const marker2 = L.marker([-6.21, 106.82]).addTo(map).bindPopup("Lokasi B");

    L.Routing.control({
      waypoints: [L.latLng(-6.2, 106.8), L.latLng(-6.21, 106.82)],
      routeWhileDragging: true,
      showAlternatives: true,
      lineOptions: {styles: [{color: 'blue', opacity: 0.7, weight: 5}]},
      createMarker: function(i, wp) { return L.marker(wp.latLng).bindPopup(`Waypoint ${i+1}`); }
    }).addTo(map);
  </script>
</body>
</html>
